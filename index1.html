
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TEMERE V</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #090d12;
      color: #e9edf2;
      font-family: Arial, sans-serif;
    }

    main {
      width: min(90%, 650px);
      padding: 40px 25px;
      text-align: center;
      border: 1px solid #33414d;
      background: #111922;
      border-radius: 12px;
    }

    h1 {
      font-size: clamp(38px, 8vw, 64px);
      letter-spacing: 5px;
      margin: 0;
    }

    h1 span { color: #e8a94c; }

    p { color: #9baab8; line-height: 1.7; }

    a {
      display: inline-block;
      margin-top: 15px;
      padding: 12px 20px;
      color: #090d12;
      background: #e8a94c;
      text-decoration: none;
      font-weight: bold;
      border-radius: 5px;
    }

    a:hover { background: #ffd080; }
  </style>
</head>
<body>
  <main>
    <h1>TEMERE <span>V</span></h1>
    <p>STAR CITIZEN · HAULING · COMMUNITY</p>
    <p>Welcome to TEMERE V. Your next destination starts here.</p>
    <a href="https://discord.com/" target="_blank"
       rel="noopener noreferrer">JOIN OUR DISCORD</a>
  </main>
</body>
</html>
